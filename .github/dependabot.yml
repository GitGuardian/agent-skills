# Keeps the pinned action SHAs and the npm dev dependencies moving.
#
# Pinning actions to a commit SHA (see the workflow files) is what stops a
# force-moved upstream tag from silently changing what runs in CI. The cost
# is that pins go stale, so Dependabot owns the bumps and each one arrives
# as a reviewable PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
