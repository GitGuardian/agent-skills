name: ggshield

on:
  push:
  pull_request:

# Least privilege. This job only reads the tree and talks to the
# GitGuardian API; it never writes back to the repo.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a moving tag: a tag can be
      # force-moved by whoever controls the action's repo, and this job runs
      # with a repo-scoped token. Dependabot bumps these (see dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: GitGuardian/ggshield-action@2002482fb5990b486be5598ebcf48a8eba393fce # v1.53.0
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
