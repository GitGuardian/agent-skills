name: ggshield

on:
  push:
  pull_request:

# Least privilege: reads the tree, talks to the GitGuardian API, never
# writes back.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: GitGuardian/ggshield-action@2002482fb5990b486be5598ebcf48a8eba393fce # v1.53.0
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
